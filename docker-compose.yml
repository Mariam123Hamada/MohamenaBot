services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: egyptian_civil_code
      CORPUS_PATH: /app/src/data/processed_corpus.json
      CHUNK_SIZE: ${CHUNK_SIZE:-150}
      MODEL_BACKEND_URL: http://bento:3000
    ports:
      - "8000:8000"
    depends_on:
      - bento
    restart: unless-stopped

  bento:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - bentoml
      - serve
      - mohamenabot.bento_service:LegalRetrievalService
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: egyptian_civil_code
      CORPUS_PATH: /app/src/data/processed_corpus.json
      CHUNK_SIZE: ${CHUNK_SIZE:-150}
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-mohamenabot-local-only}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/mohamenabot.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
