[project]
name = "mohamenabot"
version = "0.1.0"
description = "A citation-first Egyptian Civil Code retrieval chatbot"
readme = "README.md"
authors = [
    { name = "Mariam Abdelsalam", email = "mariam@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.8,<3",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.0,<6",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
mohamenabot = "mohamenabot.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "locust>=2.31,<3",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
mlops = [
    "dvc>=3.50,<4",
    "mlflow>=2.16,<4",
    "pymupdf>=1.24,<2",
]
serve = ["bentoml>=1.3,<2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mohamenabot*", "processing*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
